<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSLCE Mathematics 2017 E.C — Exam Preparation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c14;
    --surface: #111520;
    --card: #161b2e;
    --border: #1e2540;
    --accent: #4f9cf9;
    --accent2: #f9a84f;
    --correct: #3ecf8e;
    --wrong: #f16565;
    --text: #e8eaf6;
    --muted: #7a82a8;
    --gold: #f5c842;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Source Serif 4',Georgia,serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:
      radial-gradient(ellipse 80% 40% at 20% 10%, rgba(79,156,249,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(249,168,79,0.05) 0%, transparent 60%);
    pointer-events:none;z-index:0;
  }

  /* ---- HEADER ---- */
  header{
    position:relative;z-index:10;
    padding:48px 24px 36px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(79,156,249,0.06) 0%, transparent 100%);
  }
  .flag-bar{
    display:flex;justify-content:center;gap:6px;margin-bottom:20px;
  }
  .flag-bar span{
    display:block;height:5px;border-radius:3px;
  }
  .flag-bar span:nth-child(1){width:80px;background:#078930;}
  .flag-bar span:nth-child(2){width:80px;background:#fcdd09;}
  .flag-bar span:nth-child(3){width:80px;background:#ef3340;}
  .flag-bar span:nth-child(4){width:24px;background:var(--accent);border-radius:50%;}

  header h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(2rem,5vw,3.5rem);
    font-weight:900;
    letter-spacing:-1px;
    background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    line-height:1.1;
  }
  header p{
    margin-top:10px;
    color:var(--muted);
    font-size:1rem;
    font-style:italic;
    font-weight:300;
    letter-spacing:0.5px;
  }
  .meta-pills{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px;
  }
  .pill{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:100px;
    padding:5px 16px;
    font-size:0.78rem;
    font-family:'JetBrains Mono',monospace;
    color:var(--accent);
    letter-spacing:0.5px;
  }

  /* ---- SCORE DASHBOARD ---- */
  #dashboard{
    position:sticky;top:0;z-index:100;
    background:rgba(10,12,20,0.92);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:12px 24px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .dash-stat{
    display:flex;flex-direction:column;align-items:center;
  }
  .dash-stat .val{
    font-family:'JetBrains Mono',monospace;
    font-size:1.4rem;font-weight:600;
  }
  .dash-stat .lbl{
    font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  }
  .progress-ring{
    display:flex;align-items:center;gap:14px;
  }
  #prog-bar-wrap{
    width:180px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;
  }
  #prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s;}
  .dash-btn{
    background:var(--accent);color:#000;border:none;
    border-radius:8px;padding:8px 20px;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:600;
    cursor:pointer;transition:opacity .2s;
  }
  .dash-btn:hover{opacity:.8;}
  .dash-btn.reset{background:var(--border);color:var(--muted);}
  .dash-buttons{display:flex;gap:8px;}
  #d-answered { color:var(--accent); }
  #d-correct { color:var(--correct); }
  #d-wrong { color:var(--wrong); }
  #d-pct { font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--muted); }

  /* ---- LAYOUT ---- */
  main{
    max-width:900px;margin:0 auto;
    padding:40px 20px 80px;
    position:relative;z-index:1;
  }

  /* ---- SECTION TITLE ---- */
  .section-title{
    font-family:'Playfair Display',serif;
    font-size:1.1rem;
    color:var(--accent2);
    letter-spacing:2px;
    text-transform:uppercase;
    margin:48px 0 20px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
  }
  .section-title::before{
    content:'';display:block;width:28px;height:2px;background:var(--accent2);
  }

  /* ---- QUESTION CARD ---- */
  .q-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:24px;
    overflow:hidden;
    transition:border-color .3s, transform .2s;
    animation:fadeUp .5s both;
  }
  .q-card:hover{transform:translateY(-2px);border-color:#2a3260;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

  .q-header{
    display:flex;align-items:flex-start;gap:14px;
    padding:22px 24px 16px;
  }
  .q-num{
    flex-shrink:0;
    width:36px;height:36px;
    background:var(--accent);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:0.85rem;
    color:#000;
  }
  .q-num.answered-correct{background:var(--correct);}
  .q-num.answered-wrong{background:var(--wrong);}

  .q-text{
    flex:1;
    font-size:1rem;
    font-weight:400;
    line-height:1.65;
    color:var(--text);
  }
  .q-status{
    flex-shrink:0;
    font-size:1.2rem;
    margin-top:4px;
    opacity:0;transition:opacity .3s;
  }
  .q-status.show{opacity:1;}

  /* ---- OPTIONS ---- */
  .options{
    padding:0 24px 16px;
    display:grid;gap:10px;
  }
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    transition:all .2s;
    font-size:0.95rem;
    line-height:1.5;
    -webkit-user-select:none;
    user-select:none;
  }
  .opt:hover:not(.disabled){
    border-color:var(--accent);
    background:rgba(79,156,249,0.08);
  }
  .opt.correct{
    border-color:var(--correct);
    background:rgba(62,207,142,0.12);
  }
  .opt.wrong{
    border-color:var(--wrong);
    background:rgba(241,101,101,0.12);
  }
  .opt.disabled{cursor:default;}
  .opt-letter{
    flex-shrink:0;
    width:26px;height:26px;
    background:var(--border);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;font-weight:600;
    color:var(--muted);
  }
  .opt.correct .opt-letter{background:var(--correct);color:#000;}
  .opt.wrong .opt-letter{background:var(--wrong);color:#fff;}

  /* ---- EXPLANATION ---- */
  .explanation{
    display:none;
    padding:16px 24px 20px;
    border-top:1px solid var(--border);
    background:rgba(79,156,249,0.04);
    font-size:0.92rem;
    line-height:1.7;
    color:var(--muted);
  }
  .explanation.show{display:block;}
  .explanation h4{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent2);
    margin-bottom:10px;
  }
  .explanation .answer-tag{
    display:inline-block;
    background:rgba(62,207,142,0.15);
    border:1px solid var(--correct);
    color:var(--correct);
    border-radius:6px;
    padding:3px 10px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    margin-bottom:10px;
  }
  .explanation p{margin-top:6px;}
  .explanation ul{margin:8px 0 0 18px;}
  .explanation li{margin-top:4px;}
  .formula{
    font-family:'JetBrains Mono',monospace;
    background:rgba(79,156,249,0.1);
    border:1px solid rgba(79,156,249,0.2);
    border-radius:4px;
    padding:1px 6px;
    font-size:0.88rem;
    color:var(--accent);
  }

  /* ---- RESULTS OVERLAY ---- */
  #results-overlay{
    display:none;
    position:fixed;inset:0;z-index:200;
    background:rgba(10,12,20,0.85);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    align-items:center;justify-content:center;
  }
  #results-overlay.show{display:flex;}
  .results-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:48px 40px;
    text-align:center;
    max-width:480px;
    width:90%;
  }
  .results-box h2{
    font-family:'Playfair Display',serif;
    font-size:2rem;
    margin-bottom:8px;
  }
  #res-pct{
    font-family:'JetBrains Mono',monospace;
    font-size:4rem;
    font-weight:600;
    color:var(--accent);
    display:block;
    margin:16px 0 4px;
  }
  #res-frac{
    font-family:'JetBrains Mono',monospace;
    color:var(--muted);
    font-size:1.1rem;
  }
  #res-msg{
    margin:20px 0 28px;
    color:var(--muted);
    font-style:italic;
    line-height:1.6;
  }
  .results-btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  /* ---- SCROLL TOP ---- */
  #scrolltop{
    position:fixed;bottom:28px;right:28px;z-index:150;
    width:44px;height:44px;
    background:var(--accent);color:#000;
    border:none;border-radius:12px;
    font-size:1.2rem;cursor:pointer;
    opacity:0;transform:translateY(20px);
    transition:opacity .3s,transform .3s;
    pointer-events:none;
  }
  #scrolltop.visible{opacity:1;transform:none;pointer-events:all;}
  #scrolltop:hover{opacity:.8;}

  /* ---- MATH DISPLAY ---- */
  .math{
    font-family:'JetBrains Mono',monospace;
    font-style:normal;
  }
</style>
</head>
<body>

<header>
  <div class="flag-bar">
    <span></span><span></span><span></span><span></span>
  </div>
  <h1>ESSLCE Mathematics 2017 E.C</h1>
  <p>Ethiopian Secondary School Leaving Certificate Examination — Exam Preparation</p>
  <div class="meta-pills">
    <span class="pill">Subject Code: 02</span>
    <span class="pill">Booklet Code: 295</span>
    <span class="pill">60 Questions</span>
    <span class="pill">3 Hours</span>
    <span class="pill">Sene 2017 E.C / June–July 2025 G.C</span>
  </div>
</header>

<div id="dashboard">
  <div class="dash-stat">
    <span class="val" id="d-answered">0</span>
    <span class="lbl">Answered</span>
  </div>
  <div class="dash-stat">
    <span class="val" id="d-correct">0</span>
    <span class="lbl">Correct</span>
  </div>
  <div class="dash-stat">
    <span class="val" id="d-wrong">0</span>
    <span class="lbl">Wrong</span>
  </div>
  <div class="progress-ring">
    <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
    <span id="d-pct">0%</span>
  </div>
  <div class="dash-buttons">
    <button class="dash-btn" onclick="showResults()">Results</button>
    <button class="dash-btn reset" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="main-content"></main>

<div id="results-overlay">
  <div class="results-box">
    <h2>Your Score</h2>
    <span id="res-pct">0%</span>
    <span id="res-frac">0 / 60</span>
    <p id="res-msg"></p>
    <div class="results-btn-row">
      <button class="dash-btn" onclick="resetAll()">Try Again</button>
      <button class="dash-btn reset" onclick="closeResults()">Review</button>
    </div>
  </div>
</div>

<button id="scrolltop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const QUESTIONS = [
  // ---- FUNCTIONS & ALGEBRA ----
  {
    section: "Functions & Algebra",
    q: "Which one of the following functions is NOT a power function?",
    opts: [
      "f(x) = x^(−3/5)",
      "f(x) = √2 · x^(3/2)",
      "f(x) = π · x⁵",
      "f(x) = (√3)^x"
    ],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — f(x) = (√3)ˣ</span>
    <p>A <strong>power function</strong> has the form <span class="formula">f(x) = c · xⁿ</span>, where the variable x is the <em>base</em> raised to a constant exponent.</p>
    <ul>
      <li>A: x^(−3/5) — power function ✓</li>
      <li>B: √2 · x^(3/2) — power function ✓</li>
      <li>C: π · x⁵ — power function ✓</li>
      <li>D: (√3)^x — <strong>exponential function</strong> (constant base, variable exponent) ✗</li>
    </ul>`
  },
  {
    q: "Let f(x) = (1 − 2x)^(1/2). Then what is the value of f′(x)?",
    opts: [
      "1 / √(1−2x)",
      "(−1/2)√(1−2x)",
      "(1/2)√(1−2x)",
      "−1 / √(1−2x)"
    ],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — −1/√(1−2x)</span>
    <p>Using the chain rule: <span class="formula">f(x) = (1−2x)^(1/2)</span></p>
    <p><span class="formula">f′(x) = (1/2)(1−2x)^(−1/2) · (−2)</span></p>
    <p><span class="formula">= −1 · (1−2x)^(−1/2) = −1/√(1−2x)</span> ✓</p>`
  },
  {
    section: "Vectors & Scalars",
    q: "Which of the following statements describes the difference between scalar and vector quantities?",
    opts: [
      "Physical quantities that only have direction are scalars, while those that have only magnitude are vectors.",
      "Physical quantities that only have magnitude are scalars, while those that have both magnitude and direction are vectors.",
      "Physical quantities that only have magnitude are vectors, while those that have both magnitude and direction are scalars.",
      "Physical quantities that only have direction are vectors, while those that have both magnitude and direction are scalars."
    ],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B</span>
    <p><strong>Scalars</strong> are quantities described by magnitude only (e.g., temperature, mass, speed).</p>
    <p style="margin-top:6px"><strong>Vectors</strong> are quantities described by both magnitude and direction (e.g., velocity, force, displacement).</p>`
  },
  {
    section: "Statistics & Data",
    q: "Consider the data: 1, 3, 7, 9, 11, 13, 18, 28. The coefficient of mean deviation about the median is equal to:",
    opts: ["1/4", "8/5", "5/8", "1/2"],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — 1/2</span>
    <p>Data (n=8): 1, 3, 7, 9, 11, 13, 18, 28</p>
    <p><strong>Median</strong> = (9+11)/2 = 10</p>
    <p><strong>Deviations from median:</strong> |1−10|=9, |3−10|=7, |7−10|=3, |9−10|=1, |11−10|=1, |13−10|=3, |18−10|=8, |28−10|=18</p>
    <p><strong>Mean Deviation</strong> = (9+7+3+1+1+3+8+18)/8 = 50/8 = 6.25</p>
    <p><strong>Coefficient of MD</strong> = MD/Median = 6.25/10 = <strong>0.625 ≈ 5/8</strong></p>
    <p style="margin-top:4px;font-size:0.85rem;color:var(--muted)">Note: Based on standard formula, answer C (5/8) is the computed value. Check your booklet for exact answer key.</p>`
  },
  {
    section: "Number Systems",
    q: "Which one of the following is an irrational number?",
    opts: ["3.4000", "√0.04", "1.16222...", "√29"],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — √29</span>
    <ul>
      <li>3.4000 = 17/5 — rational ✗</li>
      <li>√0.04 = 0.2 = 1/5 — rational ✗</li>
      <li>1.16222... = 1.162̄ — repeating decimal, rational ✗</li>
      <li>√29 — 29 is not a perfect square, so √29 is irrational ✓</li>
    </ul>`
  },
  {
    section: "Trigonometry",
    q: "Consider the graph of a trigonometric function. The graph has amplitude 1, starts at 0 when x = 0, goes positive, with period 2π. Which function represents it for −π/2 ≤ x ≤ 5π/2?",
    opts: ["y = sec x", "y = sin x", "y = csc x", "y = cos x"],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — y = sin x</span>
    <p>The described graph has:</p>
    <ul>
      <li>Amplitude = 1</li>
      <li>Passes through origin (0, 0)</li>
      <li>Period = 2π</li>
      <li>Goes positive first (rises from 0)</li>
    </ul>
    <p style="margin-top:6px">This matches <span class="formula">y = sin x</span>. The cosine starts at y=1 when x=0; sec and csc have discontinuities.</p>`
  },
  {
    section: "Probability",
    q: "Which one of the following statements defines favorable outcomes in a random experiment?",
    opts: [
      "The outcomes that insure the occurrence of a particular result.",
      "The outcomes containing all sample elements.",
      "The outcomes containing only one sample element.",
      "The outcomes that have equal chance of being chosen."
    ],
    ans: 0,
    exp: `<span class="answer-tag">✓ Answer: A</span>
    <p><strong>Favorable outcomes</strong> are those outcomes in a sample space that result in the occurrence of a particular (desired) event.</p>
    <p style="margin-top:6px">Probability of event E = (Number of favorable outcomes) / (Total number of outcomes)</p>`
  },
  {
    section: "Logarithms",
    q: "Given that log 4.8 = 0.6812, log 6.93 = 0.8406 and log 6.84 = 0.8351. Then what is the value of √48?",
    opts: ["6.83", "6.71", "6.93", "6.84"],
    ans: 2,
    exp: `<span class="answer-tag">✓ Answer: C — 6.93</span>
    <p><span class="formula">√48 = √(16 × 3) = 4√3</span></p>
    <p>Alternative: <span class="formula">log √48 = (1/2) log 48 = (1/2) log(4.8 × 10)</span></p>
    <p><span class="formula">= (1/2)(log 4.8 + 1) = (1/2)(0.6812 + 1) = (1/2)(1.6812) = 0.8406</span></p>
    <p style="margin-top:6px">Since log 6.93 = 0.8406, we have <span class="formula">√48 = 6.93</span> ✓</p>`
  },
  {
    section: "Polynomial Functions",
    q: "Let f(x) = x³ + 2x + 1 and g(x) = x² − 1. Then which of the following is true?",
    opts: [
      "f(x)/g(x) = (x²+1)/(x−1)",
      "f(x) + g(x) = x³ + x²",
      "f(x) − g(x) = x³ − x² + 2x",
      "f(x)·g(x) = x⁵ + x³ + x² − 2x − 1"
    ],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D</span>
    <p>f(x)·g(x) = (x³ + 2x + 1)(x² − 1)</p>
    <p>= x⁵ − x³ + 2x³ − 2x + x² − 1</p>
    <p>= <span class="formula">x⁵ + x³ + x² − 2x − 1</span> ✓</p>
    <p style="margin-top:6px">Check C: f−g = x³+2x+1−(x²−1) = x³−x²+2x+2 ≠ x³−x²+2x (wrong by +2). D is correct.</p>`
  },
  {
    section: "Sets",
    q: "Let A = {x | 1 ≤ x ≤ 10} and B = {x | −1 ≤ x ≤ 10}. What is the relative complement of A with respect to B?",
    opts: [
      "{x | −1 ≤ x ≤ 0}",
      "∅",
      "{x | −1 ≤ x ≤ 1}",
      "{x | −1 ≤ x < 1}"
    ],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — {x | −1 ≤ x < 1}</span>
    <p>The relative complement of A with respect to B is <span class="formula">B \\ A = B − A</span></p>
    <p>= elements in B but NOT in A</p>
    <p>B = [−1, 10], A = [1, 10]</p>
    <p>B \\ A = <span class="formula">[−1, 1)</span> = {x | −1 ≤ x < 1} ✓</p>`
  },
  {
    section: "Rational Functions",
    q: "The graph of a rational function has vertical asymptotes at x = −1 and x = 1, and passes through the origin. Which function does it represent?",
    opts: [
      "f(x) = x² / (1−x²)",
      "f(x) = x / (x²−1)",
      "f(x) = x / (x²+1)",
      "f(x) = x² / (x²−1)"
    ],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — f(x) = x/(x²−1)</span>
    <p>The graph has vertical asymptotes where denominator = 0:</p>
    <p>x²−1 = 0 → x = ±1 ✓</p>
    <p>f(0) = 0/(0−1) = 0 — passes through origin ✓</p>
    <p>The function is odd (symmetric about origin), consistent with the graph shown.</p>`
  },
  {
    section: "Calculus",
    q: "Consider the function f(x) = x³ − 3x² + 3 on (−2, 3). Which of the following points is local minimum and local maximum respectively?",
    opts: [
      "(−2, −27) and (0, 3)",

// Remove duplicates by only keeping unique questions (some repeated from PDF scan)
const UNIQUE_QUESTIONS = QUESTIONS.filter((q, i, arr) =>
  arr.findIndex(q2 => q2.q === q.q) === i
);

let answered = new Array(UNIQUE_QUESTIONS.length).fill(false);
let correct = new Array(UNIQUE_QUESTIONS.length).fill(false);

function buildExam() {
  const main = document.getElementById('main-content');
  let currentSection = '';
  let html = '';

  UNIQUE_QUESTIONS.forEach((q, i) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      html += `<div class="section-title">${currentSection}</div>`;
    }

    const letters = ['A','B','C','D'];
    let optsHtml = '';
    q.opts.forEach((opt, j) => {
      optsHtml += `<div class="opt" id="opt-${i}-${j}" onclick="selectAnswer(${i},${j})">
        <span class="opt-letter">${letters[j]}</span>
        <span>${opt}</span>
      </div>`;
    });

    html += `
    <div class="q-card" id="card-${i}" style="animation-delay:${i*0.03}s">
      <div class="q-header">
        <div class="q-num" id="qnum-${i}">${i+1}</div>
        <div class="q-text">${q.q}</div>
        <div class="q-status" id="status-${i}"></div>
      </div>
      <div class="options" id="opts-${i}">${optsHtml}</div>
      <div class="explanation" id="exp-${i}">
        <h4>Explanation</h4>
        ${q.exp}
      </div>
    </div>`;
  });

  main.innerHTML = html;
  answered = new Array(UNIQUE_QUESTIONS.length).fill(false);
  correct = new Array(UNIQUE_QUESTIONS.length).fill(false);
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;
  const q = UNIQUE_QUESTIONS[qIdx];
  const isCorrect = optIdx === q.ans;
  correct[qIdx] = isCorrect;

  for (let j = 0; j < q.opts.length; j++) {
    const optEl = document.getElementById(`opt-${qIdx}-${j}`);
    optEl.classList.add('disabled');
    if (j === q.ans) optEl.classList.add('correct');
    else if (j === optIdx && !isCorrect) optEl.classList.add('wrong');
  }

  const qnum = document.getElementById(`qnum-${qIdx}`);
  qnum.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const status = document.getElementById(`status-${qIdx}`);
  status.textContent = isCorrect ? '✓' : '✗';
  status.style.color = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  status.classList.add('show');

  document.getElementById(`exp-${qIdx}`).classList.add('show');
  updateDashboard();
}

function updateDashboard() {
  const totalAnswered = answered.filter(Boolean).length;
  const totalCorrect = correct.filter(Boolean).length;
  const totalWrong = totalAnswered - totalCorrect;
  const pct = Math.round((totalAnswered / UNIQUE_QUESTIONS.length) * 100);

  document.getElementById('d-answered').textContent = totalAnswered;
  document.getElementById('d-correct').textContent = totalCorrect;
  document.getElementById('d-wrong').textContent = totalWrong;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('d-pct').textContent = pct + '%';
}

function showResults() {
  const totalAnswered = answered.filter(Boolean).length;
  const totalCorrect = correct.filter(Boolean).length;
  const scorePct = totalAnswered > 0 ? Math.round((totalCorrect / UNIQUE_QUESTIONS.length) * 100) : 0;

  document.getElementById('res-pct').textContent = scorePct + '%';
  document.getElementById('res-frac').textContent = totalCorrect + ' / ' + UNIQUE_QUESTIONS.length;

  let msg = '';
  if (scorePct >= 80) msg = 'Excellent! Outstanding performance. You are well-prepared for the exam!';
  else if (scorePct >= 60) msg = 'Good work! Review your incorrect answers and strengthen weak areas.';
  else if (scorePct >= 40) msg = 'Fair result. Focus on the explanations for missed questions and practice more.';
  else msg = 'Keep studying! Read each explanation carefully and try again. You can do it!';

  document.getElementById('res-msg').textContent = msg;
  document.getElementById('results-overlay').classList.add('show');
}

function closeResults() {
  document.getElementById('results-overlay').classList.remove('show');
}

function resetAll() {
  closeResults();
  buildExam();
  updateDashboard();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrolltop');
  btn.classList.toggle('visible', window.scrollY > 400);
});

buildExam();
</script>
