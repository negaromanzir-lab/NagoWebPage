<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSLCE SAT 2017 E.C — Exam Preparation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c14;
    --surface: #111520;
    --card: #161b2e;
    --border: #1e2540;
    --accent: #4f9cf9;
    --accent2: #f9a84f;
    --correct: #3ecf8e;
    --wrong: #f16565;
    --text: #e8eaf6;
    --muted: #7a82a8;
    --gold: #f5c842;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Source Serif 4',Georgia,serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:
      radial-gradient(ellipse 80% 40% at 20% 10%, rgba(79,156,249,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(249,168,79,0.05) 0%, transparent 60%);
    pointer-events:none;z-index:0;
  }

  /* ---- HEADER ---- */
  header{
    position:relative;z-index:10;
    padding:48px 24px 36px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(79,156,249,0.06) 0%, transparent 100%);
  }
  .flag-bar{display:flex;justify-content:center;gap:6px;margin-bottom:20px;}
  .flag-bar span{display:block;height:5px;border-radius:3px;}
  .flag-bar span:nth-child(1){width:80px;background:#078930;}
  .flag-bar span:nth-child(2){width:80px;background:#fcdd09;}
  .flag-bar span:nth-child(3){width:80px;background:#ef3340;}
  .flag-bar span:nth-child(4){width:24px;background:var(--accent);border-radius:50%;}

  header h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(2rem,5vw,3.5rem);
    font-weight:900;
    letter-spacing:-1px;
    background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    line-height:1.1;
  }
  header p{margin-top:10px;color:var(--muted);font-size:1rem;font-style:italic;font-weight:300;letter-spacing:0.5px;}
  .meta-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px;}
  .pill{
    background:var(--surface);border:1px solid var(--border);border-radius:100px;
    padding:5px 16px;font-size:0.78rem;font-family:'JetBrains Mono',monospace;
    color:var(--accent);letter-spacing:0.5px;
  }

  /* ---- SCORE DASHBOARD ---- */
  #dashboard{
    position:sticky;top:0;z-index:100;
    background:rgba(10,12,20,0.92);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:12px 24px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .dash-stat{display:flex;flex-direction:column;align-items:center;}
  .dash-stat .val{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:600;}
  .dash-stat .lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .progress-ring{display:flex;align-items:center;gap:14px;}
  #prog-bar-wrap{width:180px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  #prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s;}
  .dash-btn{
    background:var(--accent);color:#000;border:none;border-radius:8px;
    padding:8px 20px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;
    font-weight:600;cursor:pointer;transition:opacity .2s;
  }
  .dash-btn:hover{opacity:.8;}
  .dash-buttons{display:flex;gap:8px;}
  #d-answered { color:var(--accent); }
  #d-correct { color:var(--correct); }
  #d-wrong { color:var(--wrong); }
  #d-pct { font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--muted); }

  /* Formula note styles */
  .formula-note{color:var(--muted);font-size:0.88em;}
  .subsection-note{color:var(--muted);font-size:0.9rem;margin-bottom:16px;padding-left:4px;font-style:italic;}
  .q-card{animation:fadeUp 0.5s both;}
  .dash-buttons{display:flex;gap:8px;}
  #d-answered { color:var(--accent); }
  #d-correct { color:var(--correct); }
  #d-wrong { color:var(--wrong); }
  #d-pct { font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--muted); }

  /* ---- LAYOUT ---- */
  main{max-width:900px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1;}

  /* ---- SECTION TITLE ---- */
  .section-title{
    font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent2);
    letter-spacing:2px;text-transform:uppercase;margin:48px 0 20px;
    padding-bottom:10px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
  }
  .section-title::before{content:'';display:block;width:28px;height:2px;background:var(--accent2);}

  /* ---- PASSAGE BOX ---- */
  .passage-box{
    background:rgba(79,156,249,0.04);
    border:1px solid var(--border);
    border-left:3px solid var(--accent2);
    border-radius:12px;
    padding:20px 24px;
    margin-bottom:24px;
    font-size:0.95rem;
    line-height:1.8;
    color:var(--muted);
    font-style:italic;
  }
  .passage-box strong{color:var(--accent2);font-style:normal;}
  .passage-source{margin-top:10px;font-size:0.8rem;color:var(--muted);opacity:0.7;}

  /* ---- QUESTION CARD ---- */
  .q-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    margin-bottom:24px;overflow:hidden;transition:border-color .3s, transform .2s;
    animation:fadeUp .5s both;
  }
  .q-card:hover{transform:translateY(-2px);border-color:#2a3260;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

  .q-header{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 16px;}
  .q-num{
    flex-shrink:0;width:36px;height:36px;background:var(--accent);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:0.85rem;color:#000;
  }
  .q-num.answered-correct{background:var(--correct);}
  .q-num.answered-wrong{background:var(--wrong);}
  .q-text{flex:1;font-size:1rem;font-weight:400;line-height:1.65;color:var(--text);}
  .q-status{flex-shrink:0;font-size:1.2rem;margin-top:4px;opacity:0;transition:opacity .3s;}
  .q-status.show{opacity:1;}

  /* ---- OPTIONS ---- */
  .options{padding:0 24px 16px;display:grid;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;
    cursor:pointer;transition:all .2s;font-size:0.95rem;line-height:1.5;
    -webkit-user-select:none;
    user-select:none;
  }
  .opt:hover:not(.disabled){border-color:var(--accent);background:rgba(79,156,249,0.08);}
  .opt.correct{border-color:var(--correct);background:rgba(62,207,142,0.12);}
  .opt.wrong{border-color:var(--wrong);background:rgba(241,101,101,0.12);}
  .opt.disabled{cursor:default;}
  .opt-letter{
    flex-shrink:0;width:26px;height:26px;background:var(--border);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:600;color:var(--muted);
  }
  .opt.correct .opt-letter{background:var(--correct);color:#000;}
  .opt.wrong .opt-letter{background:var(--wrong);color:#fff;}

  /* ---- EXPLANATION ---- */
  .explanation{
    display:none;padding:16px 24px 20px;border-top:1px solid var(--border);
    background:rgba(79,156,249,0.04);font-size:0.92rem;line-height:1.7;color:var(--muted);
  }
  .explanation.show{display:block;}
  .explanation h4{
    font-family:'JetBrains Mono',monospace;font-size:0.75rem;text-transform:uppercase;
    letter-spacing:2px;color:var(--accent2);margin-bottom:10px;
  }
  .explanation .answer-tag{
    display:inline-block;background:rgba(62,207,142,0.15);border:1px solid var(--correct);
    color:var(--correct);border-radius:6px;padding:3px 10px;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;margin-bottom:10px;
  }
  .explanation p{margin-top:6px;}
  .explanation ul{margin:8px 0 0 18px;}
  .explanation li{margin-top:4px;}
  .formula{
    font-family:'JetBrains Mono',monospace;background:rgba(79,156,249,0.1);
    border:1px solid rgba(79,156,249,0.2);border-radius:4px;
    padding:1px 6px;font-size:0.88rem;color:var(--accent);
  }

  /* ---- RESULTS OVERLAY ---- */
  #results-overlay{
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(10,12,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    align-items:center;justify-content:center;
  }
  #results-overlay.show{display:flex;}
  .results-box{
    background:var(--card);border:1px solid var(--border);border-radius:24px;
    padding:48px 40px;text-align:center;max-width:480px;width:90%;
  }
  .results-box h2{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:8px;}
  #res-pct{font-family:'JetBrains Mono',monospace;font-size:4rem;font-weight:600;color:var(--accent);display:block;margin:16px 0 4px;}
  #res-frac{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:1.1rem;}
  #res-msg{margin:20px 0 28px;color:var(--muted);font-style:italic;line-height:1.6;}
  .results-btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  /* ---- SCROLL TOP ---- */
  #scrolltop{
    position:fixed;bottom:28px;right:28px;z-index:150;width:44px;height:44px;
    background:var(--accent);color:#000;border:none;border-radius:12px;
    font-size:1.2rem;cursor:pointer;opacity:0;transform:translateY(20px);
    transition:opacity .3s,transform .3s;pointer-events:none;
  }
  #scrolltop.visible{opacity:1;transform:none;pointer-events:all;}
  #scrolltop:hover{opacity:.8;}
</style>
</head>
<body>

<header>
  <div class="flag-bar">
    <span></span><span></span><span></span><span></span>
  </div>
  <h1>ESSLCE SAT 2017 E.C</h1>
  <p>Ethiopian Secondary School Leaving Certificate Examination — Scholastic Aptitude Test</p>
  <div class="meta-pills">
    <span class="pill">Subject Code: 03</span>
    <span class="pill">Booklet Code: 396</span>
    <span class="pill">60 Questions</span>
    <span class="pill">2 Hours</span>
    <span class="pill">Section 1: Verbal (Q1–35) · Section 2: Quantitative (Q36–60)</span>
  </div>
</header>

<div id="dashboard">
  <div class="dash-stat">
    <span class="val" id="d-answered">0</span>
    <span class="lbl">Answered</span>
  </div>
  <div class="dash-stat">
    <span class="val" id="d-correct">0</span>
    <span class="lbl">Correct</span>
  </div>
  <div class="dash-stat">
    <span class="val" id="d-wrong">0</span>
    <span class="lbl">Wrong</span>
  </div>
  <div class="progress-ring">
    <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
    <span id="d-pct">0%</span>
  </div>
  <div class="dash-buttons">
    <button class="dash-btn" onclick="showResults()">Results</button>
    <button class="dash-btn reset" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="main-content"></main>

<div id="results-overlay">
  <div class="results-box">
    <h2>Your Score</h2>
    <span id="res-pct">0%</span>
    <span id="res-frac">0 / 60</span>
    <p id="res-msg"></p>
    <div class="results-btn-row">
      <button class="dash-btn" onclick="resetAll()">Try Again</button>
      <button class="dash-btn reset" onclick="closeResults()">Review</button>
    </div>
  </div>
</div>

<button id="scrolltop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const PASSAGE_1 = `<div class="passage-box"><strong>Passage I</strong><br><br>
If you want transition from being an employee to an employer, the first step is to serve your current employer as you would wish to be served. Most successful employers today have risen through the ranks, relying on their ability to manage and direct others effectively by suppressing the vices of employers. They started with no more opportunities than you have now.<br><br>
There are people in your community who could benefit from your skills and vice versa. For example, Mr. John Smith wants to sell his grocery store and start a movie theater, while someone else with a movie theater might want to trade for a grocery store. If you can connect these two individuals, you will serve both and earn a commission in the process.
<div class="passage-source">Source: Hill, N. (2005). The law of success: The 21st century edition (pp. 633-634)</div></div>`;

const PASSAGE_2 = `<div class="passage-box"><strong>Passage II</strong><br><br>
What is the matter with our reading is casualness, languor, preoccupation. We don't give the book a chance. We don't put ourselves at the disposal of the book. It is impossible to read properly without using all one's engine power. If we are not tired after reading, common sense is not in us. How one should grapple with a superior and not be out of breath?<br><br>
But even if we read with the whole force of our brain, and do nothing else, common sense is still not in us, while sublime conceit is. For we are assuming that, without further trouble, we can possess, co-ordinate, and assimilate all the ideas and sensations rapidly offered to us by a mind greater than our own. The assumption has only to be stated in order to appear in its monstrous absurdity. Hence, it follows that something remains to be done. This something is the act of reflection. Reading without subsequent reflection is ridiculous; it is equally a proof of folly and vanity.
<div class="passage-source">Source: Warriner, J. E. et al. 1958. English Grammar & Composition. P420</div></div>`;

const BAR_GRAPH_INFO = `<div class="passage-box"><strong>Study Patterns of a Student (Bar Graph)</strong><br><br>
The following bar graph shows the data of a student's study pattern recorded for 32 days:<br><br>
• <strong>2 hours</strong> of study: <strong>10 days</strong><br>
• <strong>4 hours</strong> of study: <strong>7 days</strong><br>
• <strong>6 hours</strong> of study: <strong>7 days</strong><br>
• <strong>8 hours</strong> of study: <strong>5 days</strong><br>
• <strong>10 hours</strong> of study: <strong>3 days</strong><br><br>
Total days = 10+7+7+5+3 = 32 days ✓
</div>`;

const QUESTIONS = [
  // ============ SECTION ONE: VERBAL REASONING ============
  // ---- Classification ----
  {
    section: "Section One: Verbal Reasoning — Classification",
    subsection_note: "Choose the word that does NOT fit the group.",
    q: "1. Choose the word that does NOT belong to the group: Voting, Signal-box, Ballot-box, Election",
    opts: ["Voting", "Signal-box", "Ballot-box", "Election"],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — Signal-box</span>
    <p>Voting, Ballot-box, and Election are all related to the democratic election process.</p>
    <p><strong>Signal-box</strong> is a railway/traffic control structure — it does not belong to the election category.</p>`
  },
  {
    q: "2. Choose the word that does NOT belong to the group: Boat, Vehicle, Ship, Yacht",
    opts: ["Boat", "Vehicle", "Ship", "Yacht"],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — Vehicle</span>
    <p>Boat, Ship, and Yacht are all types of watercraft (vessels that travel on water).</p>
    <p><strong>Vehicle</strong> is a general term covering land, air, and water transport — it is the odd one out in this specifically water-based group.</p>`
  },
  {
    q: "3. Choose the word that does NOT belong to the group: Striding, Strolling, Flying, Tiptoeing",
    opts: ["Striding", "Strolling", "Flying", "Tiptoeing"],
    ans: 2,
    exp: `<span class="answer-tag">✓ Answer: C — Flying</span>
    <p>Striding, Strolling, and Tiptoeing are all ways of walking on foot (ground movement).</p>
    <p><strong>Flying</strong> is movement through the air — it does not belong to this group of walking styles.</p>`
  },
  {
    q: "4. Choose the word that does NOT belong to the group: Polyandry, Polyglot, Polygamy, Monogamy",
    opts: ["Polyandry", "Polyglot", "Polygamy", "Monogamy"],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — Polyglot</span>
    <p>Polyandry (one wife, multiple husbands), Polygamy (multiple spouses), and Monogamy (one spouse) are all terms related to marriage/matrimonial systems.</p>
    <p><strong>Polyglot</strong> refers to a person who speaks many languages — unrelated to marriage.</p>`
  },

  // ---- Reading Comprehension: Passage I (Q5-8) ----
  {
    section: "Reading Comprehension — Passage I",
    passage: PASSAGE_1,
    q: "5. What does the sentence 'most successful employers today have risen through the ranks, relying on their ability to manage and direct others effectively' imply?",
    opts: [
      "Most successful employers have proven their leadership ability through their journey.",
      "All successful employers today have reached their level passing through lots of ups and downs.",
      "Having different ranks and rewards is the real manifestation of successful employers.",
      "Every successful employer is the result of his/her hard work and diligence."
    ],
    ans: 0,
    exp: `<span class="answer-tag">✓ Answer: A</span>
    <p>The sentence directly states that successful employers rose by <em>managing and directing others effectively</em> — which means they demonstrated leadership ability throughout their journey.</p>
    <p>A is the most accurate paraphrase. B overgeneralizes; C and D are not supported by the specific sentence quoted.</p>`
  },
  {
    q: "6. The main intent of the writer in the text is to imply that ___.",
    opts: [
      "there are steps that one needs to undergo in the transition from employee to employer.",
      "most successful employers are those who have achieved their dreams through trade-off.",
      "smooth transition from being an employer to employee is more of a matter of destiny than hard work.",
      "the transition from employee to employer does not require much effort except having the interest."
    ],
    ans: 0,
    exp: `<span class="answer-tag">✓ Answer: A</span>
    <p>The passage opens with "the first step is to serve your current employer" and goes on to describe how one can create business connections — implying there is a process (steps) involved in transitioning from employee to employer.</p>
    <p>Options C and D contradict the passage's emphasis on effort and skill.</p>`
  },
  {
    q: "7. In Paragraph 2, the phrase 'these two individuals' refers to ___.",
    opts: [
      "people and the community as a whole.",
      "the employer and the employee.",
      "the grocery store and the movie theatre.",
      "John Smith & the person in movie industry."
    ],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — John Smith & the person in the movie industry</span>
    <p>The passage says: "Mr. John Smith wants to sell his grocery store and start a movie theater, while someone else with a movie theater might want to trade for a grocery store."</p>
    <p>"These two individuals" refers specifically to John Smith and the other person (the movie theater owner who wants the grocery store).</p>`
  },
  {
    q: "8. According to the passage, what does the word 'vices' most likely denote?",
    opts: ["ambitions", "weaknesses", "strengths", "deputies"],
    ans: 1,
    exp: `<span class="answer-tag">✓ Answer: B — weaknesses</span>
    <p>The passage states employers rose "by suppressing the vices of employers." In context, <strong>vices</strong> means bad habits or <strong>weaknesses</strong> — qualities that need to be suppressed/overcome to succeed.</p>
    <p>This is the standard meaning of "vices" (moral faults, failings, or weaknesses).</p>`
  },

  // ---- Analytical and Logical Reasoning (Q9-14) ----
  {
    section: "Analytical and Logical Reasoning",
    q: "9. How many months have a twenty-eighth day?",
    opts: ["two months", "one month", "twelve months", "seven months"],
    ans: 2,
    exp: `<span class="answer-tag">✓ Answer: C — twelve months</span>
    <p>ALL twelve months of the year have at least 28 days.</p>
    <p>The question asks which months <em>have</em> a 28th day — not which months have <em>only</em> 28 days. February (even in a leap year) has 28 or 29 days, so it always has a 28th day. Every other month has 30 or 31 days, so they also have a 28th day.</p>
    <p>Answer: all <strong>12 months</strong> ✓</p>`
  },
  {
    q: "10. Which of the following can be rearranged into a 5-letter English word?",
    opts: ["PASEH", "GOFAT", "DWAEP", "PYRIO"],
    ans: 0,
    exp: `<span class="answer-tag">✓ Answer: A — PASEH</span>
    <p>Rearranging the letters:</p>
    <ul>
      <li>PASEH → <strong>SHAPE</strong> (S-H-A-P-E) ✓ — a valid English word</li>
      <li>GOFAT → FAGOT (valid) — but check if A is the intended answer</li>
      <li>DWAEP → no common English word</li>
      <li>PYRIO → no common English word</li>
    </ul>
    <p>PASEH → SHAPE is the clearest common English word. ✓</p>`
  },
  {
    q: "11. Gad is older than Dan and Dan is older than Betti. With Senni being older than Dan and younger than Gad, who is the youngest?",
    opts: ["Dan", "Gad", "Senni", "Betti"],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — Betti</span>
    <p>Order the ages from the clues:</p>
    <ul>
      <li>Gad > Dan (Gad is older than Dan)</li>
      <li>Dan > Betti (Dan is older than Betti)</li>
      <li>Gad > Senni > Dan (Senni is older than Dan but younger than Gad)</li>
    </ul>
    <p>Full order: <strong>Gad > Senni > Dan > Betti</strong></p>
    <p>Youngest = <strong>Betti</strong> ✓</p>`
  },
  {
    q: "12. Statement I: All football players are sportspersons. Statement II: All sportspersons are fit. Conclusion: Some football players are not fit. This conclusion is:",
    opts: ["appropriate", "reasonably correct", "can't be determined", "incorrect"],
    ans: 3,
    exp: `<span class="answer-tag">✓ Answer: D — incorrect</span>
    <p>From the two statements:</p>
    <ul>
      <li>All football players → sportspersons</li>
      <li>All sportspersons → fit</li>
    </ul>
    <p>By syllogism: All football players are fit (transitivity). Therefore the conclusion "Some football players are NOT fit" is <strong>incorrect</strong> — it directly contradicts what the premises imply. ✓</p>`
  },
  {
    q: "13. If two days after tomorrow is four days before Saturday, what day is it today?",
    opts: ["Monday", "Sunday", "Saturday", "Friday"],
    ans: 0,

let answered = new Array(QUESTIONS.length).fill(false);
let correct = new Array(QUESTIONS.length).fill(false);

function buildExam() {
  const main = document.getElementById('main-content');
  let currentSection = '';
  let html = '';
  let passageShown = {};

  QUESTIONS.forEach((q, i) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      html += `<div class="section-title">${currentSection}</div>`;
    }
    if (q.subsection_note) {
      html += `<p class="subsection-note">${q.subsection_note}</p>`;
    }
    // Show passage before relevant question
    if (q.passage && !passageShown[q.passage]) {
      html += q.passage;
      passageShown[q.passage] = true;
    }

    const letters = ['A','B','C','D'];
    let optsHtml = '';
    q.opts.forEach((opt, j) => {
      optsHtml += `<div class="opt" id="opt-${i}-${j}" onclick="selectAnswer(${i},${j})">
        <span class="opt-letter">${letters[j]}</span>
        <span>${opt}</span>
      </div>`;
    });

    html += `
    <div class="q-card" id="card-${i}">
      <div class="q-header">
        <div class="q-num" id="qnum-${i}">${i+1}</div>
        <div class="q-text">${q.q}</div>
        <div class="q-status" id="status-${i}"></div>
      </div>
      <div class="options" id="opts-${i}">${optsHtml}</div>
      <div class="explanation" id="exp-${i}">
        <h4>Explanation</h4>
        ${q.exp}
      </div>
    </div>`;
  });

  main.innerHTML = html;
  answered = new Array(QUESTIONS.length).fill(false);
  correct = new Array(QUESTIONS.length).fill(false);
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;
  const q = QUESTIONS[qIdx];
  const isCorrect = optIdx === q.ans;
  correct[qIdx] = isCorrect;

  for (let j = 0; j < q.opts.length; j++) {
    const optEl = document.getElementById(`opt-${qIdx}-${j}`);
    optEl.classList.add('disabled');
    if (j === q.ans) optEl.classList.add('correct');
    else if (j === optIdx && !isCorrect) optEl.classList.add('wrong');
  }

  const qnum = document.getElementById(`qnum-${qIdx}`);
  qnum.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const status = document.getElementById(`status-${qIdx}`);
  status.textContent = isCorrect ? '✓' : '✗';
  status.style.color = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  status.classList.add('show');

  document.getElementById(`exp-${qIdx}`).classList.add('show');
  updateDashboard();
}

function updateDashboard() {
  const totalAnswered = answered.filter(Boolean).length;
  const totalCorrect = correct.filter(Boolean).length;
  const totalWrong = totalAnswered - totalCorrect;
  const pct = Math.round((totalAnswered / QUESTIONS.length) * 100);

  document.getElementById('d-answered').textContent = totalAnswered;
  document.getElementById('d-correct').textContent = totalCorrect;
  document.getElementById('d-wrong').textContent = totalWrong;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('d-pct').textContent = pct + '%';
}

function showResults() {
  const totalAnswered = answered.filter(Boolean).length;
  const totalCorrect = correct.filter(Boolean).length;
  const scorePct = totalAnswered > 0 ? Math.round((totalCorrect / QUESTIONS.length) * 100) : 0;

  document.getElementById('res-pct').textContent = scorePct + '%';
  document.getElementById('res-frac').textContent = totalCorrect + ' / ' + QUESTIONS.length;

  let msg = '';
  if (scorePct >= 80) msg = 'Excellent! Outstanding performance. You are well-prepared for the SAT exam!';
  else if (scorePct >= 60) msg = 'Good work! Review your incorrect answers and strengthen weak areas.';
  else if (scorePct >= 40) msg = 'Fair result. Focus on the explanations for missed questions and practice more.';
  else msg = 'Keep studying! Read each explanation carefully and try again. You can do it!';

  document.getElementById('res-msg').textContent = msg;
  document.getElementById('results-overlay').classList.add('show');
}

function closeResults() {
  document.getElementById('results-overlay').classList.remove('show');
}

function resetAll() {
  closeResults();
  buildExam();
  updateDashboard();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrolltop');
  btn.classList.toggle('visible', window.scrollY > 400);
});

buildExam();
</script>
